[project]
name = "aid4u"
version = "0.1.0"
description = "AI Devs 4 — task runner"
requires-python = ">=3.13"
dependencies = [
    # LLM providers
    "anthropic>=0.40",
    "openai>=1.50",
    "google-genai>=2.1.0",
    # deprecieted (refactor needed)!!!
    "google-generativeai>=0.8",
    # Observability — musi być zainicjalizowane jako PIERWSZE (przed jakimkolwiek I/O)
    "logfire[httpx]>=2.0",
    "logfire-api>=2.0",
    "langfuse>=2.50",
    # HTTP + server
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Data + validation
    "pydantic>=2.9",
    "openapi-pydantic>=0.4",
    # CLI + UX
    "typer>=0.13",
    "prompt-toolkit>=3.0",
    "rich>=13.0",
    # Security / secrets
    "keyring>=25.0",
    "python-dotenv>=1.0",
    # Niezawodność
    "tenacity>=9.0",
    "openai-agents>=0.17.4",
    "pytest>=9.1.1",
    "anyio>=4.13.0",
    "keyrings-alt>=5.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tasks", "tests"]
markers = [
    "integration: wymaga kluczy API i sieci — uruchamiaj świadomie",
]
# Domyślnie pomijaj testy integracyjne
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E402 wyłączamy globalnie - koniec z krzykiem o importy nie na samej górze pliku!
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
# F401 - zaimportowane, ale nieużyte (przydatne, gdy dopiero piszesz test i eksperymentujesz)
"tests/**/*.py" = ["F401"]
"conftest.py" = ["F401"]

[tool.pyright]
pythonVersion = "3.13"
# Ustalamy na basic, żeby był pomocny, ale nie spowalniał pracy (strict bywa upierdliwy)
typeCheckingMode = "basic"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "tasks", "scripts"]
