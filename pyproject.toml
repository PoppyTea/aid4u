[project]
name = "aid4u"
version = "0.1.0"
description = "AI Devs 4 — task runner"
requires-python = ">=3.13"
dependencies = [
    # LLM providers
    "anthropic>=0.40",
    "openai>=1.50",
    "google-genai>=2.1.0",
    # Observability — musi być zainicjalizowane jako PIERWSZE (przed jakimkolwiek I/O)
    "logfire[httpx,system-metrics]>=2.0",
    "logfire-api>=2.0",
    "langfuse>=4.0",
    # HTTP + server
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Data + validation
    "pydantic>=2.9",
    "openapi-pydantic>=0.4",
    # CLI + UX
    "typer>=0.13",
    "prompt-toolkit>=3.0",
    "rich>=13.0",
    # Security / secrets
    "keyring>=25.0",
    "python-dotenv>=1.0",
    # Niezawodność
    "tenacity>=9.0",
    "openai-agents>=0.17.4",
    "anyio>=4.13.0",
    "keyrings-alt>=5.0.2",
    "pydantic-ai-slim[google,openai]>=2.5.0",
    "pydantic-ai-harness[logfire]>=0.9.0",
    "pydantic-ai>=2.18.0",
    "requests>=2.34.2",
    "types-requests>=2.33.0.20260712",
    "mcp[cli]>=1.28.1",
    "mem0ai>=2.0.14",
    "tiktoken>=0.13.0",
    # Image decoding + analiza tablicowa — deterministyczna analiza mapy w s02e05_drone
    # (grid/sektor bez LLM/vision). numpy było dotąd tylko tranzytywne (przez qdrant-client) —
    # deklarujemy wprost, bo map_analysis.py go bezpośrednio importuje.
    "pillow>=11.0",
    "numpy>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "pyrefly>=1.1.1",
    "basedpyright>=1.39.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tasks", "tests"]
markers = [
    "integration: wymaga kluczy API i sieci — uruchamiaj świadomie",
]
# Domyślnie pomijaj testy integracyjne
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E402 wyłączamy globalnie - koniec z krzykiem o importy nie na samej górze pliku!
ignore = ["E402"]
select = [
    "E",  # pycodestyle errors
    "W",  # pyflakes
    "F",  # pyflakes
    "C",  # flake8-comprehensions
    "PT", # flake8-pytest-style
    "UP", # pyupgrade
    "RET",# flake8-return
]
[tool.ruff.lint.per-file-ignores]
# F401 - zaimportowane, ale nieużyte (przydatne, gdy dopiero piszesz test i eksperymentujesz)
"tests/**/*.py" = ["F401"]
"conftest.py" = ["F401"]

# basedpyright — fallback dla pyrefly (patrz pyrefly.toml). Rygor: "standard" w core/,
# "basic" w tasks/ i tests/ (kod kursowy, WIP, mocki) przez executionEnvironments niżej.
# Ghost-text/inlay hints konfiguruje się po stronie Zed (.zed/settings.json), nie tutaj.
[tool.basedpyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
include = ["core", "tasks", "tests", "scripts"]
exclude = ["**/__pycache__", ".venv"]
typeCheckingMode = "standard"

[[tool.basedpyright.executionEnvironments]]
root = "tasks"
typeCheckingMode = "basic"

[[tool.basedpyright.executionEnvironments]]
root = "tests"
typeCheckingMode = "basic"

[[tool.basedpyright.python.analysis.inlayHints]]
enabled = true
callArgumentNames = "partial"
variableTypes = true
functionReturnTypes = true
pytestParameters = true
inlayHintDebounceMs = 150
# core/ nie ma własnego executionEnvironment — celowo dziedziczy typeCheckingMode
# "standard" wprost z sekcji [tool.basedpyright] powyżej (to jest ta "ostrzejsza" strefa).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "tasks", "scripts"]
